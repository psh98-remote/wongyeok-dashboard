  <div style="background:#fff;border:1px solid #e9e9e7;border-radius:16px;padding:40px 44px;width:380px;max-width:94vw;box-shadow:0 8px 32px rgba(0,0,0,.08)">
    <div style="text-align:center;margin-bottom:32px">
      <div style="width:44px;height:44px;background:#2383e2;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto 14px">📋</div>
      <div style="font-size:19px;font-weight:600;color:#1a1a18;letter-spacing:-0.5px">원격점검 관리시스템</div>
      <div style="font-size:13px;color:#9b9b9b;margin-top:5px">한컴이노스트림 기술지원팀</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px">
      <div>
        <label style="font-size:11px;color:#6b6b6b;font-weight:600;display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:0.3px">이메일</label>
        <input type="email" id="login-email" placeholder="name@hancomins.com" style="width:100%;padding:9px 12px;border:1px solid #e9e9e7;border-radius:6px;font-size:14px;outline:none;font-family:inherit;transition:border-color .15s,box-shadow .15s" onfocus="this.style.borderColor='#2383e2';this.style.boxShadow='0 0 0 2px rgba(35,131,226,.12)'" onblur="this.style.borderColor='#e9e9e7';this.style.boxShadow='none'" onkeydown="if(event.key==='Enter')document.getElementById('login-pw').focus()">
      </div>
      <div>
        <label style="font-size:11px;color:#6b6b6b;font-weight:600;display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:0.3px">비밀번호</label>
        <input type="password" id="login-pw" placeholder="••••••••" style="width:100%;padding:9px 12px;border:1px solid #e9e9e7;border-radius:6px;font-size:14px;outline:none;font-family:inherit;transition:border-color .15s,box-shadow .15s" onfocus="this.style.borderColor='#2383e2';this.style.boxShadow='0 0 0 2px rgba(35,131,226,.12)'" onblur="this.style.borderColor='#e9e9e7';this.style.boxShadow='none'" onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <div id="login-error" style="color:#c9302c;font-size:12px;display:none;padding:6px 0;background:#fdf0f0;border-radius:6px;padding:8px 12px;text-align:center"></div>
      <button onclick="doLogin()" id="login-btn" style="width:100%;padding:11px;background:#2383e2;color:#fff;border:none;border-radius:6px;font-size:14px;font-weight:500;cursor:pointer;margin-top:4px;font-family:inherit;transition:background .15s;letter-spacing:-0.2px" onmouseover="this.style.background='#1a6bbf'" onmouseout="this.style.background='#2383e2'">로그인</button>
    </div>
  </div>
</div>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>원격점검 관리 시스템</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff;
  --bg2:#f7f7f5;
  --bg3:#f1f1ef;
  --border:#e9e9e7;
  --border2:#d3d3cf;
  --text:#1a1a18;
  --text2:#6b6b6b;
  --text3:#9b9b9b;
  --accent:#2383e2;
  --accent-light:#e8f1fb;
  --accent-hover:#1a6bbf;
  --green:#2d9a4e;
  --green-bg:#ebf7ee;
  --red:#c9302c;
  --red-bg:#fdf0f0;
  --orange:#d97706;
  --orange-bg:#fef3e2;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 12px rgba(0,0,0,.08),0 2px 4px rgba(0,0,0,.04);
  --radius:6px;
  --radius-md:8px;
  --radius-lg:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg2);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}

/* ── HEADER ── */
header{background:var(--bg);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;gap:16px;height:48px;position:sticky;top:0;z-index:100;box-shadow:var(--shadow)}
.header-logo{display:flex;align-items:center;gap:8px}
.header-logo-icon{width:24px;height:24px;background:var(--accent);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:13px}
header h1{font-size:14px;font-weight:600;color:var(--text);letter-spacing:-0.2px}
.header-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.hdr-date{font-size:12px;color:var(--text3)}
.logout-btn{font-size:12px;color:var(--text2);background:none;border:1px solid var(--border);border-radius:var(--radius);padding:4px 10px;cursor:pointer;transition:all .15s}
.logout-btn:hover{background:var(--bg3);color:var(--text)}

/* ── NAV ── */
.nav{display:flex;gap:1px;padding:0 24px;background:var(--bg);border-bottom:1px solid var(--border);overflow-x:auto}
.nav-btn{padding:10px 14px;font-size:13px;cursor:pointer;border:none;background:none;color:var(--text2);border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px;letter-spacing:-0.1px;transition:color .15s;display:flex;align-items:center;gap:6px}
.nav-btn:hover{color:var(--text);background:var(--bg2)}
.nav-btn.active{color:var(--accent);font-weight:500;border-bottom-color:var(--accent)}
.nav-icon{font-size:14px}

/* ── PAGE ── */
.page{display:none;padding:24px;max-width:1320px}
.page.active{display:block}
.page-header{margin-bottom:20px}
.page-title{font-size:20px;font-weight:600;color:var(--text);letter-spacing:-0.5px;margin-bottom:4px}
.page-desc{font-size:13px;color:var(--text3)}

/* ── STATS ── */
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--bg);border:1.5px solid var(--border);border-radius:var(--radius-md);padding:16px 18px;transition:all .15s;cursor:default}
.stat:hover{box-shadow:var(--shadow-md);border-color:var(--border2);transform:translateY(-1px)}
.stat-label{font-size:11px;color:var(--text3);margin-bottom:8px;font-weight:500;letter-spacing:0.2px;display:flex;align-items:center;gap:4px}
.stat-val{font-size:28px;font-weight:700;letter-spacing:-1.5px;line-height:1}

/* ── TOOLBAR ── */
.toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=date],input[type=email],select,textarea{padding:7px 11px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px;background:var(--bg);color:var(--text);outline:none;font-family:inherit;transition:border-color .15s,box-shadow .15s;height:36px}
input[type=text]:focus,input[type=date]:focus,input[type=email]:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(35,131,226,.12)}
.search-input{height:34px;min-width:180px;flex:1}
.filter-select{height:34px}

/* ── BUTTONS ── */
.btn{height:32px;padding:0 14px;border-radius:var(--radius);font-size:13px;cursor:pointer;border:1.5px solid var(--border);background:var(--bg);color:var(--text);white-space:nowrap;display:inline-flex;align-items:center;gap:5px;transition:all .15s;font-family:inherit;font-weight:500;letter-spacing:-0.1px}
.btn:hover{background:var(--bg2);border-color:var(--border2)}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:500;box-shadow:0 1px 2px rgba(35,131,226,.3)}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);box-shadow:0 2px 6px rgba(35,131,226,.35)}
.btn-danger{color:var(--red);border-color:var(--border)}
.btn-danger:hover{background:var(--red-bg);border-color:#f0a0a0}
.btn-sm{height:26px;padding:0 9px;font-size:12px}
.btn-link{background:none;border:none;color:var(--accent);cursor:pointer;font-size:12px;padding:0;text-decoration:none}
.btn-link:hover{text-decoration:underline}

/* ── TABLE ── */
.table-wrap{overflow-x:auto;border-radius:var(--radius-md);border:1px solid var(--border);background:var(--bg);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;background:var(--bg)}
th{text-align:left;padding:9px 14px;font-size:11px;font-weight:600;color:var(--text3);background:var(--bg2);border-bottom:1px solid var(--border);white-space:nowrap;letter-spacing:0.3px;text-transform:uppercase}
td{padding:9px 14px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle;color:var(--text)}
td.ellipsis{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg2)}
.actions{display:flex;gap:4px;flex-wrap:nowrap}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500;white-space:nowrap;letter-spacing:0.1px}
.b-done{background:var(--green-bg);color:var(--green)}
.b-todo{background:var(--red-bg);color:var(--red)}
.b-plan{background:var(--orange-bg);color:var(--orange)}
.b-monthly{background:var(--accent-light);color:var(--accent)}
.b-quarter{background:#f0effd;color:#5b50d6}
.b-warn{background:var(--orange-bg);color:var(--orange)}
.tag{display:inline-block;background:var(--bg3);color:var(--text2);padding:1px 7px;border-radius:4px;font-size:11px;margin-right:3px;border:1px solid var(--border)}

/* ── ALERT ── */
.alert-card{background:var(--orange-bg);border:1px solid #fcd58a;border-radius:var(--radius-md);padding:10px 14px;margin-bottom:10px;font-size:13px;display:flex;align-items:center;gap:10px}
.alert-card .alert-title{font-weight:500;color:#92500a}
.alert-card .alert-body{color:var(--orange)}

/* ── SEARCH BOX ── */
.search-box{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px 16px;margin-bottom:20px;box-shadow:var(--shadow)}
.search-box-title{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.search-result-item{padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:6px;cursor:pointer;background:var(--bg);display:flex;align-items:center;justify-content:space-between;transition:all .15s}
.search-result-item:hover{background:var(--accent-light);border-color:var(--accent);transform:translateX(2px)}
.search-result-name{font-size:13px;font-weight:500}
.search-result-meta{font-size:12px;color:var(--text3);margin-top:2px}
.search-result-arrow{font-size:12px;color:var(--accent);opacity:0}
.search-result-item:hover .search-result-arrow{opacity:1}

/* ── TODO CARDS ── */
.todo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;margin-top:14px}
.todo-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px 16px;transition:all .15s;box-shadow:var(--shadow)}
.todo-card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.todo-card.done{border-color:#b8dda0;background:#f5fbf0}
.todo-card.plan{border-color:#fcd58a;background:#fffbf0}
.todo-card-name{font-size:14px;font-weight:600;color:var(--text);margin-bottom:4px;letter-spacing:-0.2px}
.todo-card-meta{font-size:12px;color:var(--text3);margin-bottom:8px}
.todo-card-footer{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.todo-card-date{font-size:11px;color:var(--text3)}

/* ── TIMELINE ── */
.timeline{position:relative;padding-left:22px}
.timeline::before{content:'';position:absolute;left:6px;top:4px;bottom:4px;width:1px;background:var(--border)}
.tl-item{position:relative;margin-bottom:16px}
.tl-dot{position:absolute;left:-18px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--accent);border:2px solid var(--bg);box-shadow:0 0 0 1.5px var(--accent)}
.tl-dot.done{background:var(--green);box-shadow:0 0 0 1.5px var(--green)}
.tl-dot.todo{background:var(--border2);box-shadow:0 0 0 1.5px var(--border2)}
.tl-date{font-size:11px;color:var(--text3);margin-bottom:3px;font-weight:500}
.tl-content{font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* ── MODAL ── */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:300;align-items:flex-start;justify-content:center;padding-top:48px;overflow-y:auto;backdrop-filter:blur(2px)}
.overlay.open{display:flex}
.modal{background:var(--bg);border-radius:16px;padding:28px 30px;width:580px;max-width:96vw;margin-bottom:48px;box-shadow:0 8px 40px rgba(0,0,0,.12),0 2px 8px rgba(0,0,0,.06);border:1px solid var(--border)}
.modal-lg{width:760px}
.modal h2{font-size:17px;font-weight:600;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;letter-spacing:-0.4px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.modal h2 button{background:none;border:none;cursor:pointer;width:30px;height:30px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:18px;line-height:1;transition:all .15s}
.modal h2 button:hover{background:var(--bg3);color:var(--text)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-group.full{grid-column:1/-1}
label.flabel{font-size:11px;color:var(--text3);font-weight:500;letter-spacing:0.2px}
.form-group input,.form-group select,.form-group textarea{width:100%}
textarea{resize:vertical;min-height:72px;height:auto}
.form-group input,.form-group select{height:36px}
.form-group textarea{height:auto}
.form-group{position:relative}
.form-group input,.form-group select,.form-group textarea{
  background:var(--bg2);
  border:1.5px solid var(--border);
  border-radius:var(--radius-md);
  padding:8px 12px;
  font-size:13px;
  transition:all .15s;
  width:100%;
}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{
  background:var(--bg);
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(35,131,226,.1);
  outline:none;
}
.form-group input:hover,.form-group select:hover,.form-group textarea:hover{
  border-color:var(--border2);
}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:24px;padding-top:18px;border-top:1px solid var(--border)}

/* ── MODAL TABS ── */
.modal-tabs{display:flex;gap:4px;background:var(--bg2);border-radius:var(--radius-md);padding:4px;margin-bottom:18px}
.modal-tab{padding:7px 16px;font-size:12px;cursor:pointer;border:none;background:none;color:var(--text2);border-radius:var(--radius);transition:all .15s;font-weight:500}
.modal-tab:hover{color:var(--text);background:rgba(0,0,0,.04)}
.modal-tab.active{color:var(--text);background:var(--bg);box-shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);font-weight:600}
.modal-tab-content{display:none}
.modal-tab-content.active{display:block}

/* ── SUB TABLE ── */
.sub-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px;border-radius:var(--radius);overflow:hidden;border:1px solid var(--border)}
.sub-table th{padding:7px 10px;background:var(--bg2);border-bottom:1px solid var(--border);font-weight:600;color:var(--text3);text-align:left;text-transform:uppercase;letter-spacing:0.3px;font-size:10px}
.sub-table td{padding:8px 10px;border-bottom:1px solid var(--border);color:var(--text)}
.sub-table tr:last-child td{border-bottom:none}
.sub-table tr:hover td{background:var(--bg2)}

/* ── FILE DROP ── */
.file-drop{border:1.5px dashed var(--border2);border-radius:var(--radius-md);padding:20px;text-align:center;cursor:pointer;color:var(--text3);font-size:13px;transition:all .15s;background:var(--bg2)}
.file-drop:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}

/* ── TOAST ── */
.toast{position:fixed;bottom:24px;right:24px;background:#1a1a18;color:#fff;padding:10px 16px;border-radius:var(--radius-md);font-size:13px;z-index:9999;opacity:0;transition:all .25s;pointer-events:none;box-shadow:var(--shadow-md);display:flex;align-items:center;gap:8px}
.toast.show{opacity:1;transform:translateY(-4px)}

/* ── MISC ── */
.empty{text-align:center;padding:40px;color:var(--text3);font-size:13px}
.loading{text-align:center;padding:40px;color:var(--text3);font-size:13px}
.modal-section{margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
.modal-section h3{font-size:12px;font-weight:600;margin-bottom:10px;color:var(--text2);text-transform:uppercase;letter-spacing:0.3px}
</style>
</head>
<body>
<header>
  <div class="header-logo">
    <div class="header-logo-icon">📋</div>
    <h1>원격점검 관리시스템</h1>
  </div>
  <div class="header-right">
    <span class="hdr-date" id="hdr-date"></span>
    <button onclick="doLogout()" class="logout-btn">로그아웃</button>
  </div>
</header>
<div class="nav">
  <button class="nav-btn active" onclick="goPage('home',this)"><span class="nav-icon">🏠</span> 이번 달 할 일</button>
  <button class="nav-btn" onclick="goPage('customers',this)"><span class="nav-icon">🏢</span> 고객사</button>
  <button class="nav-btn" onclick="goPage('inspections',this)"><span class="nav-icon">✅</span> 점검 현황</button>
  
  <button class="nav-btn" onclick="goPage('reports',this)"><span class="nav-icon">📁</span> 보고서</button>
  <button class="nav-btn" onclick="goPage('history',this)"><span class="nav-icon">📅</span> 히스토리</button>
</div>

<!-- ═══ HOME ═══ -->
<div class="page active" id="page-home">
  <div class="stat-row" id="home-stats"></div>
  <div id="home-alerts"></div>

  <!-- 고객사 검색 -->
  <div class="search-box">
    <div class="search-box-title">🔍 고객사 빠른 검색</div>
    <div style="display:flex;gap:8px">
      <input class="search-input" type="text" id="quick-search" placeholder="고객사명 입력..." oninput="quickSearch()" onkeydown="if(event.key==='Enter')quickSearch()" style="flex:1">
      <button class="btn btn-primary" onclick="quickSearch()">검색</button>
    </div>
    <div id="quick-search-results" style="margin-top:8px"></div>
  </div>

  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
    <strong style="font-size:14px" id="home-month-title"></strong>
    <div style="display:flex;gap:6px">
      <select class="filter-select" id="home-filter" onchange="renderHome()">
        <option value="">전체</option><option value="미완료">미완료만</option><option value="완료">완료만</option><option value="예정">예정만</option>
      </select>
      <select class="filter-select" id="home-mgr" onchange="renderHome()">
        <option value="">전체 담당자</option>
        <option>박소희</option><option>한대웅</option><option>정상우</option><option>유재천</option>
      </select>
    </div>
  </div>
  <div class="todo-grid" id="home-grid"></div>
</div>

<!-- ═══ CUSTOMERS ═══ -->
<div class="page" id="page-customers">
  <div class="toolbar">
    <input class="search-input" type="text" id="cq" placeholder="고객사명 검색..." oninput="renderCustomers()">
    <select class="filter-select" id="c-cycle" onchange="renderCustomers()">
      <option value="">전체 주기</option><option>월1회</option><option>분기</option><option>장애시(필요시)</option>
    </select>
    <select class="filter-select" id="c-prod" onchange="renderCustomers()">
      <option value="">전체 제품</option><option>리포트</option><option>이폼</option><option>코드엑스</option><option>한글로폼</option><option>유니파이</option><option>한글로폼</option>
    </select>
    <select class="filter-select" id="c-mgr" onchange="renderCustomers()">
      <option value="">전체 담당자</option><option>박소희</option><option>한대웅</option><option>정상우</option><option>유재천</option>
    </select>
    <button class="btn btn-primary" onclick="openCustModal()">+ 고객사 추가</button>
    <button class="btn btn-danger" onclick="deleteSelected()" id="delete-selected-btn" style="display:none">선택 삭제</button>
  </div>
  <div class="table-wrap">

<script>
const SB_URL = 'https://akqpyhgtuwiftivslrwz.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFrcXB5aGd0dXdpZnRpdnNscnd6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzODE4NzQsImV4cCI6MjA5NTk1Nzg3NH0.1LgG40MwqQVyDuOJ88aaytOidZXdPUh4fFYbt4-qBp8';
const HEADERS = { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json', 'Prefer': 'return=representation' };

const sb = {
  from: (table) => {
    const q = {
      _table: table, _filters: [], _order: [], _select: '*', _updateData: null, _method: 'GET',
      select(s){ this._select=s; return this; },
      order(col, opts={}){ this._order.push(col+(opts.ascending===false?'.desc':'.asc')); return this; },
      eq(col,val){ this._filters.push(col+'=eq.'+encodeURIComponent(val)); return this; },
      _buildUrl(){ 
        let u = SB_URL+'/rest/v1/'+this._table+'?apikey='+SB_KEY+'&select='+this._select;
        if(this._filters.length) u += '&' + this._filters.join('&');
        if(this._order.length) u += '&order=' + this._order.join(',');
        return u;
      },
      async _run(){
        const url = this._buildUrl();
        let opts = {headers:{...HEADERS,'Accept':'application/json'}};
        if(this._method==='PATCH') opts = {method:'PATCH',headers:HEADERS,body:JSON.stringify(this._updateData)};
        else if(this._method==='DELETE') opts = {method:'DELETE',headers:{...HEADERS,'Prefer':'return=minimal'}};
        const r = await fetch(url, opts);
        if(this._method==='DELETE') return r.ok?{data:null,error:null}:{data:null,error:{message:'delete failed'}};
        const d = await r.json().catch(()=>[]);
        return r.ok?{data:d,error:null}:{data:null,error:d};
      },
      then(res,rej){ return this._run().then(res,rej); },
      update(data){ this._updateData=data; this._method='PATCH'; return this; },
      delete(){ this._method='DELETE'; return this; },
      async insert(data){ 
        const url = SB_URL+'/rest/v1/'+this._table+'?apikey='+SB_KEY;
        const r = await fetch(url,{method:'POST',headers:HEADERS,body:JSON.stringify(data)});
        const d = await r.json().catch(()=>[]);
        return r.ok?{data:d,error:null}:{data:null,error:d};
      },
    };
    return q;
  },
  storage: {
    from: (bucket) => ({
      async upload(path, file){ const r=await fetch(`${SB_URL}/storage/v1/object/${bucket}/${path}?apikey=${SB_KEY}`,{method:'POST',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY},body:file}); const d=await r.json(); return r.ok?{data:d,error:null}:{data:null,error:d}; },
      getPublicUrl(path){ return {data:{publicUrl:`${SB_URL}/storage/v1/object/public/${bucket}/${path}`}}; }
    })
  }
};

let DATA = { customers:[], systems:[], inspections:[], licenses:[], reports:[], contacts:[], access:[] };
let selectedFiles = [];
const NOW = new Date();
const THIS_MONTH = String(NOW.getMonth()+1).padStart(2,'0');
const THIS_YEAR = String(NOW.getFullYear());

document.getElementById('hdr-date').textContent = NOW.toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric'});

async function loadAll() {
  const [c,sy,i,l,r,ct,a] = await Promise.all([
    sb.from('customers').select('*').order('name'),
    sb.from('systems').select('*').order('customer_id'),
    sb.from('inspections').select('*').order('year',{ascending:false}).order('month',{ascending:false}).order('customer_name'),
    sb.from('licenses').select('*').order('customer_name'),
    sb.from('reports').select('*').order('created_at',{ascending:false}),
    sb.from('contacts').select('*'),
    sb.from('access_info').select('*'),
  ]);
  DATA.customers = c.data||[];
  DATA.systems = sy.data||[];
  DATA.inspections = i.data||[];
  DATA.licenses = l.data||[];
  DATA.reports = r.data||[];
  DATA.contacts = ct.data||[];
  DATA.access = a.data||[];
  updateDataLists();
  renderHome();
  renderCustomers();
  renderInspections();
  renderReports();
  renderHistory();
}

function updateDataLists() {
  ['cust-dl','cust-dl3'].forEach(id => {
    document.getElementById(id).innerHTML = DATA.customers.map(c=>`<option value="${c.name}">`).join('');
  });
}

// ── PAGE NAV ──
function goPage(p, el) {
  document.querySelectorAll('.page').forEach(e=>e.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(e=>e.classList.remove('active'));
  document.getElementById('page-'+p).classList.add('active');
  if(el) el.classList.add('active');
  else document.querySelectorAll('.nav-btn').forEach(e=>{
    if(e.getAttribute('onclick')&&e.getAttribute('onclick').includes("'"+p+"'")) e.classList.add('active');
  });
}

// ── HOME ──
function renderHome() {
  const filter = document.getElementById('home-filter').value;
  const mgr = document.getElementById('home-mgr').value;
  const mLabel = {'01':'1월','02':'2월','03':'3월','04':'4월','05':'5월','06':'6월','07':'7월','08':'8월','09':'9월','10':'10월','11':'11월','12':'12월'};
  document.getElementById('home-month-title').textContent = `${THIS_YEAR}년 ${mLabel[THIS_MONTH]} 점검 현황`;

  const thisMonthInsp = DATA.inspections.filter(i=>i.year===THIS_YEAR && i.month===THIS_MONTH);
  const done = thisMonthInsp.filter(i=>i.status==='완료').length;
  const todo = thisMonthInsp.filter(i=>i.status==='미완료').length;
  const plan = thisMonthInsp.filter(i=>i.status==='예정').length;
  const total = thisMonthInsp.length;

  document.getElementById('home-stats').innerHTML = `
    <div class="stat"><div class="stat-label">이번 달 전체</div><div class="stat-val">${total}</div></div>
    <div class="stat"><div class="stat-label">완료</div><div class="stat-val" style="color:#3B6D11">${done}</div></div>
    <div class="stat"><div class="stat-label">미완료</div><div class="stat-val" style="color:#A32D2D">${todo}</div></div>
    <div class="stat"><div class="stat-label">예정</div><div class="stat-val" style="color:#854F0B">${plan}</div></div>
    <div class="stat"><div class="stat-label">완료율</div><div class="stat-val" style="color:#185FA5">${total?Math.round(done/total*100):0}%</div></div>
  `;

  // 보안서약 만료 알림
  const alerts = [];
  const soon = new Date(); soon.setDate(soon.getDate()+30);
  DATA.customers.forEach(c=>{
    if(c.security_expire_date){
      const exp = new Date(c.security_expire_date);
      if(exp <= soon) alerts.push(`<div class="alert-card">⚠️ <div><div class="alert-title">${c.name}</div><div class="alert-body">보안서약서 갱신 필요 (${c.security_expire_date})</div></div></div>`);
    }
    if(c.contract_end){
      const exp = new Date(c.contract_end);
      if(exp <= soon) alerts.push(`<div class="alert-card">📋 <div><div class="alert-title">${c.name}</div><div class="alert-body">유지보수 계약 만료 예정 (${c.contract_end})</div></div></div>`);
    }
  });
  document.getElementById('home-alerts').innerHTML = alerts.join('');

  let rows = thisMonthInsp;
  if(filter) rows = rows.filter(i=>i.status===filter);
  if(mgr) rows = rows.filter(i=>i.manager===mgr);

  const statusClass = s => s==='완료'?'done':s==='예정'?'plan':'';
  const badge = s => s==='완료'?'<span class="badge b-done">완료</span>':s==='예정'?'<span class="badge b-plan">예정</span>':'<span class="badge b-todo">미완료</span>';

  document.getElementById('home-grid').innerHTML = rows.length ? rows.map(i=>`
    <div class="todo-card ${statusClass(i.status)}">
      <div class="todo-card-name">${i.customer_name}</div>
      <div class="todo-card-meta" style="margin-bottom:6px">${i.product||''} ${i.version||''} · ${i.manager||'-'}</div>

async function quickStatus(id, status) {
  const today = new Date().toISOString().slice(0,10);
  const {error} = await sb.from('inspections').update({status, inspection_date: today}).eq('id',id);
  if(error){showToast('저장 실패',true);return;}
  showToast('완료 처리됐어요!');
  const idx = DATA.inspections.findIndex(i=>i.id===id);
  if(idx>=0){DATA.inspections[idx].status=status;DATA.inspections[idx].inspection_date=today;}
  renderHome(); renderInspections();
}

function renderCustomers() {
  const q = document.getElementById('cq').value.toLowerCase();
  const cycle = document.getElementById('c-cycle').value;
  const prod = document.getElementById('c-prod').value;
  const mgr = document.getElementById('c-mgr').value;
  const cycBadge = s => s==='월1회'?'<span class="badge b-monthly">월1회</span>':s==='분기'?'<span class="badge b-quarter">분기</span>':`<span class="tag">${s||'-'}</span>`;

  let rows = DATA.customers.filter(c=>{
    if(q && !c.name.toLowerCase().includes(q)) return false;
    const sysList = DATA.systems.filter(s=>s.customer_id===c.id);
    if(cycle && !sysList.some(s=>s.cycle===cycle)) return false;
    if(prod && !sysList.some(s=>(s.product||'').includes(prod))) return false;
    if(mgr && !sysList.some(s=>s.manager===mgr)) return false;
    return true;
  });

  // 같은 고객사명끼리 묶기
  const grouped = [];
  const seen = {};
  rows.forEach(c => {
    if(!seen[c.name]) {
      seen[c.name] = { customers: [], name: c.name };
      grouped.push(seen[c.name]);
    }
    seen[c.name].customers.push(c);
  });

  document.getElementById('cust-body').innerHTML = grouped.length ? grouped.map(g => {
    const multiContract = g.customers.length > 1;
    const allSystems = g.customers.flatMap(c => {
      const sysList = DATA.systems.filter(s=>s.customer_id===c.id);
      return sysList.map(s=>({...s, _contract: c.contract_name, _cid: c.id}));
    });

    const sysHtml = allSystems.length ? allSystems.map(s=>`
      <div style="display:flex;gap:6px;align-items:center;padding:3px 0;border-bottom:1px solid var(--border);font-size:12px;flex-wrap:wrap">
        ${cycBadge(s.cycle)}
        <span style="color:var(--text);font-weight:500">${s.system_name||'시스템명 없음'}</span>
        <span style="color:var(--text3)">${s.product||''} ${s.version||''}</span>
        <span style="color:var(--text3)">· ${s.manager||'-'}</span>
        ${s.vpn==='사용'?'<span class="tag">VPN</span>':''}
        ${multiContract?`<span style="font-size:10px;color:var(--text3);margin-left:auto;background:var(--bg3);padding:1px 6px;border-radius:3px;white-space:nowrap">${s._contract||''}</span>`:''}
      </div>`).join('') : '<span style="font-size:12px;color:var(--text3)">-</span>';

    const firstC = g.customers[0];
    const btnHtml = g.customers.map(c=>
      `<button class="btn btn-sm" onclick="editCustomer(${c.id})" title="${c.contract_name||''}">수정${multiContract?` <span style="font-size:10px;opacity:.6">(${(c.contract_name||'').slice(0,4)})</span>`:''}</button>`
    ).join('');

    const checkIds = g.customers.map(c=>c.id).join(',');
    return `<tr style="vertical-align:top" data-ids="${checkIds}">
      <td style="width:36px;padding-top:12px"><input type="checkbox" class="row-check" value="${checkIds}" onchange="updateDeleteBtn()"></td>
      <td title="${g.name}"><strong style="font-size:13px">${g.name}</strong></td>
      <td style="font-size:12px;color:var(--text2)">${g.customers.map(c=>c.contract_name||'').filter(v=>v).join('<br>') || '-'}</td>
      <td style="min-width:300px">${sysHtml}</td>
      <td>${firstC.security||'-'}</td>
      <td style="font-size:11px;color:var(--text3);white-space:nowrap">${firstC.contract_start?firstC.contract_start.slice(0,10):''}${firstC.contract_end?' ~ '+firstC.contract_end.slice(0,10):''}</td>
      <td class="actions">${btnHtml}</td>
    </tr>`;
  }).join('') : '<tr><td colspan="7" class="empty">검색 결과 없음</td></tr>';
}

function updateDeleteBtn() {
  const checked = document.querySelectorAll('.row-check:checked').length;
  const btn = document.getElementById('delete-selected-btn');
  if(btn) btn.style.display = checked > 0 ? 'inline-flex' : 'none';
  const all = document.querySelectorAll('.row-check').length;
  const chkAll = document.getElementById('check-all');
  if(chkAll) chkAll.indeterminate = checked > 0 && checked < all;
  if(chkAll) chkAll.checked = checked === all && all > 0;
}

async function deleteSelected() {

  if(!confirm(`선택한 ${ids.length}개 항목을 삭제할까요?`)) return;

    await sb.from('customers').delete().eq('id', id);

  await loadAll();
}

async function saveCustomer() {
  const id = document.getElementById('cust-id').value;
  const name = document.getElementById('f-name').value.trim();
  if(!name){alert('고객사명을 입력해주세요');return;}
  const data = {
    name,
    contract_name: document.getElementById('f-contract').value,
    security: document.getElementById('f-security').value,
    security_expire_date: document.getElementById('f-sec-expire').value||null,
    contract_start: document.getElementById('f-contract-start').value||null,
    contract_end: document.getElementById('f-contract-end').value||null,
  };
  let err, savedName = name, savedId = id ? parseInt(id) : null;
  if(id){ ({error:err}=await sb.from('customers').update(data).eq('id',id)); }
  else {
    const {data:newCust, error:insErr} = await sb.from('customers').insert(data);
    err = insErr;
    if(!err && newCust && newCust.length) savedId = newCust[0].id;
  }
  if(err){showToast('저장 실패: '+err.message,true);return;}

  // save systems
  const systemDivs = document.getElementById('system-list-area').querySelectorAll('[data-systemid]');
  for(const div of systemDivs){
    const sid = div.dataset.systemid;
    const sd = {
      customer_id: savedId,
      customer_name: savedName,
      system_name: div.querySelector('.sys-name').value,
      cycle: div.querySelector('.sys-cycle').value,
      base_month: div.querySelector('.sys-base-month').value,
      specific_day: div.querySelector('.sys-specific-day').value,
      product: div.querySelector('.sys-product').value,
      version: div.querySelector('.sys-version').value,
      manager: div.querySelector('.sys-manager').value,
      vpn: div.querySelector('.sys-vpn').value,
    };
    if(sid && /^\d+$/.test(sid)) await sb.from('systems').update(sd).eq('id', parseInt(sid));
    else if(sd.system_name||sd.product) await sb.from('systems').insert(sd);
  }

  // save contacts
  const contactDivs = document.getElementById('contact-list-area').querySelectorAll('.form-grid');
  for(const div of contactDivs){
    const cid = div.dataset.contactid;
    const cd = {
      customer_name:savedName,
      contact_name:div.querySelector('.ct-name').value,
      department:div.querySelector('.ct-dept').value,
      phone:div.querySelector('.ct-phone').value,
      email:div.querySelector('.ct-email').value,
      cc_email:div.querySelector('.ct-cc').value,
      note:div.querySelector('.ct-note').value,
    };
    if(cid && !cid.startsWith('1')) await sb.from('contacts').update(cd).eq('id',cid);
    else if(cd.contact_name||cd.phone||cd.email) await sb.from('contacts').insert(cd);
  }
  // save access
  const accessDivs = document.getElementById('access-list-area').querySelectorAll('.form-grid');
  for(const div of accessDivs){
    const aid = div.dataset.accessid;
    const ad = {
      customer_name:savedName,
      method:div.querySelector('.ac-method').value,
      account:div.querySelector('.ac-account').value,
      note:div.querySelector('.ac-note').value,
      file_name: div.dataset.fileName || null,
      file_url: div.dataset.fileUrl || null,
    };
    // 파일 업로드 처리
    const fileInput = div.querySelector('.ac-file');
    if(fileInput && fileInput.files[0]) {
      const file = fileInput.files[0];
      const ext = file.name.includes('.') ? file.name.split('.').pop() : '';
      const filePath = Date.now() + '_' + Math.random().toString(36).slice(2,6) + (ext?'.'+ext:'');
      const {data:upData, error:upErr} = await sb.storage.from('manuals').upload(filePath, file);
      if(!upErr) {
        const {data:urlData} = sb.storage.from('manuals').getPublicUrl(filePath);
        ad.file_name = file.name;
        ad.file_url = urlData.publicUrl;
      }
    }
    if(aid && /^\d+$/.test(aid)) await sb.from('access_info').update(ad).eq('id', parseInt(aid));
    else if(ad.note||ad.account||ad.file_url) await sb.from('access_info').insert(ad);
  }

  // save licenses
  const licenseDivs = document.getElementById('license-list-area').querySelectorAll('[data-licenseid]');
  for(const div of licenseDivs){
    const lid = div.dataset.licenseid;
    const ld = {
      customer_name: savedName,
      project_name: div.querySelector('.lic-project').value,
      product: div.querySelector('.lic-product').value,
      version: div.querySelector('.lic-version').value,
      ip: div.querySelector('.lic-ip').value,

async function saveReport(){
  const cn=document.getElementById('rf-name').value.trim();
  if(!cn){alert('고객사명을 입력해주세요');return;}
  if(!selectedFiles.length){alert('파일을 선택해주세요');return;}
  showToast('업로드 중... (0/'+selectedFiles.length+')');
  const year=document.getElementById('rf-year').value;
  const month=document.getElementById('rf-month').value;
  const note=document.getElementById('rf-note').value;
  let ok=0, fail=0;
  for(const file of selectedFiles){
    const ext = file.name.includes('.') ? file.name.split('.').pop() : '';
    const filePath = Date.now() + '_' + Math.random().toString(36).slice(2,6) + (ext ? '.' + ext : '');
    const {data:upData,error:upErr}=await sb.storage.from('reports').upload(filePath,file);
    if(upErr){fail++;continue;}
    const {data:urlData}=sb.storage.from('reports').getPublicUrl(filePath);
    const data={customer_name:cn,year,month,file_name:file.name,file_url:urlData.publicUrl,note};
    const {error}=await sb.from('reports').insert(data);
    if(error) fail++; else ok++;
  }
  if(fail>0) showToast(ok+'개 등록, '+fail+'개 실패', true);
  else showToast(ok+'개 보고서 등록됐어요!');
  closeModal('rep-modal');await loadAll();
}

  if(!confirm('삭제할까요?'))return;
  await sb.from('reports').delete().eq('id',id);
  showToast('삭제됐어요');await loadAll();
}

}

async function saveCardNote(id, note) {
  const {error} = await sb.from('inspections').update({note}).eq('id', parseInt(id));
  if(error){ showToast('저장 실패', true); return; }
  const idx = DATA.inspections.findIndex(i=>i.id===parseInt(id));
  if(idx>=0) DATA.inspections[idx].note = note;
  showToast('비고 저장됐어요');
}

function openSchedulePopup(id) {
  const i = DATA.inspections.find(x => x.id === id);
  document.getElementById('schedule-insp-id').value = id;
  document.getElementById('schedule-date').value = i && i.inspection_date ? normalizeDate(i.inspection_date) : '';
  document.getElementById('schedule-note').value = '';
  document.getElementById('schedule-modal').classList.add('open');
}

async function saveSchedule() {
  const id = document.getElementById('schedule-insp-id').value;
  const date = document.getElementById('schedule-date').value;
  const note = document.getElementById('schedule-note').value;
  if(!date){ alert('날짜를 선택해주세요'); return; }
  const displayDate = date.replace(/-/g,'.') + (note ? ' ' + note : '');
  const {error} = await sb.from('inspections').update({
    status: '예정',
    inspection_date: displayDate
  }).eq('id', parseInt(id));
  if(error){ showToast('저장 실패', true); return; }
  showToast('예정 등록됐어요!');
  closeModal('schedule-modal');
  const idx = DATA.inspections.findIndex(x => x.id === parseInt(id));
  if(idx >= 0){ DATA.inspections[idx].status = '예정'; DATA.inspections[idx].inspection_date = displayDate; }
  renderHome(); renderInspections();
}

function normalizeDate(s){
  if(!s) return '';
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const m = s.match(/(\d{4})[.\-\/](\d{1,2})[.\-\/](\d{1,2})/);
  if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  return '';
}

// 모달 바깥 클릭으로 닫기 비활성화
function showToast(msg,isErr){
  const t=document.getElementById('toast');
  t.textContent=msg;t.style.background=isErr?'#A32D2D':'#1a1a18';
  t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);
}

// ── AUTH ──
async function checkAuth() {
  const session = localStorage.getItem('sb_session');
  if(session) {
    try {
      const s = JSON.parse(session);
      if(s.expires_at && Date.now() / 1000 < s.expires_at) {
        showApp();
        return;
      }
    } catch(e) {}
  }
  showLoginPage();
}

function showLoginPage() {
  document.getElementById('login-page').style.display = 'flex';
  document.querySelector('header').style.display = 'none';
  document.querySelector('.nav').style.display = 'none';
}

function showApp() {
  document.getElementById('login-page').style.display = 'none';
  document.querySelector('header').style.display = 'flex';
  document.querySelector('.nav').style.display = 'flex';
  // 모든 페이지 숨기고 home만 표시
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-home').classList.add('active');
  // 탭 active 초기화
  document.querySelectorAll('.nav-btn').forEach((b,i) => b.classList.toggle('active', i===0));
  loadAll();
}

async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pw = document.getElementById('login-pw').value;
  const errEl = document.getElementById('login-error');
  errEl.style.display = 'none';
  if(!email || !pw) { errEl.textContent = '이메일과 비밀번호를 입력해주세요'; errEl.style.display = 'block'; return; }
  const btn = document.getElementById('login-btn');
  btn.textContent = '로그인 중...'; btn.disabled = true;
  try {
    const r = await fetch(SB_URL + '/auth/v1/token?grant_type=password', {
      method: 'POST',
      headers: { 'apikey': SB_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: pw })
    });
    const data = await r.json();
    if(!r.ok) throw new Error(data.error_description || data.msg || '로그인 실패');
    localStorage.setItem('sb_session', JSON.stringify({
      access_token: data.access_token,
      expires_at: data.expires_at || (Date.now()/1000 + 3600*24)
    }));
    showApp();
  } catch(e) {
    errEl.textContent = '이메일 또는 비밀번호가 올바르지 않아요';
    errEl.style.display = 'block';
    btn.textContent = '로그인'; btn.disabled = false;
  }
}

function doLogout() {
  localStorage.removeItem('sb_session');
  location.reload();
}

checkAuth();
</script>
